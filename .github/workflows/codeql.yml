name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C++
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        shell: powershell
        run: |
          # Explicit tracing also captures MSVC when developer-environment setup
          # starts a nested cmd process on the hosted Windows runner.
          & "$env:CODEQL_DIST\codeql.exe" database trace-command $env:CODEQL_EXTRACTOR_CPP_WIP_DATABASE -- cmd.exe /d /c build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'CodeQL traced build failed.' }
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      - name: Keep extraction diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-diagnostics
          path: ${{ runner.temp }}/codeql_databases/**/log/**
          retention-days: 7
