name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native executable
        shell: cmd
        run: build.cmd
      - name: Test simulated monitors and helper isolation
        shell: powershell
        run: .\scripts\test.ps1
      - name: Validate release package
        shell: powershell
        run: .\scripts\package.ps1
      - name: Keep test results and candidate package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-ci
          path: |
            test-results/
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: warn
